name: Weishaupt static release

# Static ebusd binaries of this fork (runtime CRC for Weishaupt) for the Home Assistant add-on of
# aghulas/ha-addons. A tag v*-weishaupt.* builds and publishes a release; a manual run only builds.

on:
  push:
    tags: ['v*-weishaupt.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: build and test
        run: |
          mkdir out
          docker run --rm -v "$PWD":/src:ro -v "$PWD/out":/out alpine:3.20 sh /src/contrib/weishaupt/build-static.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ebusd-${{ matrix.arch }}
          path: out/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat dist/sha256-*.txt > dist/sha256sums.txt
          rm dist/sha256-*.txt
          gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" --target "${{ github.sha }}" \
            --notes "Static ebusd (MQTT, no TLS/KNX) built from ${{ github.sha }} with the runtime CRC for Weishaupt (attribute wcrc or [WCRC] marker). For the eBUSd add-on of aghulas/ha-addons."
